<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Brand & Green Scale" subtitle="Julia brand colors + full green scale" viewport="700x200" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; font-family: var(--font-sans); background: #fff; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatch { flex: 1; min-width: 60px; border-radius: var(--radius-md); overflow: hidden; }
  .color-box { height: 56px; }
  .info { padding: 6px 8px; }
  .name { font-size: 11px; font-weight: 600; color: var(--gray-700); }
  .hex  { font-size: 10px; font-family: var(--font-mono); color: var(--gray-500); }
  .section-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--gray-500); margin: 0 0 8px; }
  .section { margin-bottom: 16px; }
</style>
</head>
<body>
<div class="section">
  <p class="section-label">Julia Brand</p>
  <div class="row">
    <div class="swatch"><div class="color-box" style="background:#389826"></div><div class="info"><div class="name">Green</div><div class="hex">#389826</div></div></div>
    <div class="swatch"><div class="color-box" style="background:#4063D8"></div><div class="info"><div class="name">Blue</div><div class="hex">#4063D8</div></div></div>
    <div class="swatch"><div class="color-box" style="background:#9558B2"></div><div class="info"><div class="name">Purple</div><div class="hex">#9558B2</div></div></div>
    <div class="swatch"><div class="color-box" style="background:#CB3C33"></div><div class="info"><div class="name">Red</div><div class="hex">#CB3C33</div></div></div>
  </div>
</div>
<div class="section">
  <p class="section-label">Green Scale</p>
  <div class="row">
    <div class="swatch"><div class="color-box" style="background:#f0faea; border:1px solid #e9ecef"></div><div class="info"><div class="name">50</div><div class="hex">#f0faea</div></div></div>
    <div class="swatch"><div class="color-box" style="background:#dcf5d7; border:1px solid #e9ecef"></div><div class="info"><div class="name">100</div><div class="hex">#dcf5d7</div></div></div>
    <div class="swatch"><div class="color-box" style="background:#b6ecab"></div><div class="info"><div class="name">200</div><div class="hex">#b6ecab</div></div></div>
    <div class="swatch"><div class="color-box" style="background:#7dda71"></div><div class="info"><div class="name">300</div><div class="hex">#7dda71</div></div></div>
    <div class="swatch"><div class="color-box" style="background:#4dc43d"></div><div class="info"><div class="name">400</div><div class="hex">#4dc43d</div></div></div>
    <div class="swatch"><div class="color-box" style="background:#389826"></div><div class="info"><div class="name">500 ★</div><div class="hex">#389826</div></div></div>
    <div class="swatch"><div class="color-box" style="background:#2c7a1e"></div><div class="info"><div class="name">600</div><div class="hex">#2c7a1e</div></div></div>
    <div class="swatch"><div class="color-box" style="background:#205c15"></div><div class="info"><div class="name">700</div><div class="hex">#205c15</div></div></div>
    <div class="swatch"><div class="color-box" style="background:#163d0e"></div><div class="info"><div class="name">800</div><div class="hex">#163d0e</div></div></div>
    <div class="swatch"><div class="color-box" style="background:#0c2008"></div><div class="info"><div class="name">900</div><div class="hex">#0c2008</div></div></div>
  </div>
</div>
</body></html>

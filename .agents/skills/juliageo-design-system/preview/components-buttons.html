<!DOCTYPE html>
<!-- @dsCard group="Components" name="Buttons" subtitle="Primary, secondary, ghost, danger — all sizes and states" viewport="700x200" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 20px 24px; font-family: var(--font-sans); background: #fff; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .section-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--gray-400); margin: 0 0 10px; }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 0 16px; height: 36px; border-radius: 6px; font-size: 14px; font-weight: 500; font-family: var(--font-sans); cursor: pointer; border: 1.5px solid transparent; transition: all 150ms ease; text-decoration: none; }
  .btn-primary { background: #389826; color: #fff; border-color: #389826; }
  .btn-primary:hover { background: #2c7a1e; border-color: #2c7a1e; }
  .btn-secondary { background: transparent; color: #389826; border-color: #389826; }
  .btn-secondary:hover { background: #f0faea; }
  .btn-ghost { background: transparent; color: #495057; border-color: #dee2e6; }
  .btn-ghost:hover { background: #f1f3f5; }
  .btn-danger { background: #CB3C33; color: #fff; border-color: #CB3C33; }
  .btn-danger:hover { background: #a8302a; }
  .btn-sm { height: 28px; padding: 0 12px; font-size: 12px; border-radius: 4px; }
  .btn-lg { height: 44px; padding: 0 24px; font-size: 16px; }
  .btn:disabled, .btn[disabled] { opacity: 0.45; cursor: not-allowed; }
</style>
</head>
<body>
  <p class="section-label">Primary Actions</p>
  <div class="row">
    <a class="btn btn-primary">Get Started</a>
    <a class="btn btn-secondary">View on GitHub</a>
    <a class="btn btn-ghost">API Reference</a>
    <a class="btn btn-danger">Delete</a>
  </div>
  <p class="section-label">Sizes</p>
  <div class="row">
    <a class="btn btn-primary btn-sm">Small</a>
    <a class="btn btn-primary">Default</a>
    <a class="btn btn-primary btn-lg">Large</a>
  </div>
  <p class="section-label">States</p>
  <div class="row">
    <a class="btn btn-primary" style="background:#2c7a1e;border-color:#2c7a1e">Hover</a>
    <a class="btn btn-primary" style="box-shadow:0 0 0 3px #b6ecab">Focused</a>
    <a class="btn btn-primary" disabled>Disabled</a>
    <a class="btn btn-secondary" style="background:#f0faea">Hover</a>
    <a class="btn btn-secondary" disabled>Disabled</a>
  </div>
</body></html>

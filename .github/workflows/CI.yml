# Throwaway probe branch.  This file replaces CI on `claude/ci-level13-probe`
# so that `gh workflow run CI.yml --ref claude/ci-level13-probe` runs *only*
# the hydrology pipeline on a real runner, and answers two questions the local
# measurements can only guess at:
#
#   1. does the page still need the 20 GB swap file at level 12 with `dggpoly`?
#      — answered: no.  6.75 GiB peak, no swap, 2m30s of pipeline.
#   2. does level 13 fit on a runner at all?  With `dggpoly` it reached 14.56 GiB
#      and died drawing the last two figures, so the run below asks the same
#      question of `dggresample`, with and without the swap file.
#
# `Sys.maxrss` counts resident pages, so once the kernel starts swapping it
# stops describing the footprint.  A sampler records used memory plus used swap
# every two seconds and the job reports the high-water mark.
name: CI
on:
  workflow_dispatch:

jobs:
  hydrology:
    name: "hydrology level ${{ matrix.level }} ${{ matrix.draw }} (swap: ${{ matrix.swap }})"
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - level: 13
            draw: resample
            swap: 'no'
          - level: 13
            draw: resample
            swap: 'yes'
    env:
      JULIA_NUM_THREADS: '4'
      DATADEPS_ALWAYS_ACCEPT: 'true'
      DISPLAY: ':0'
    steps:
      - name: Describe the runner
        run: |
          nproc; free -h; swapon --show; df -h / /mnt || true
      - name: Add swap space
        if: matrix.swap == 'yes'
        run: |
          set -x
          sudo swapoff -a
          sudo rm -f /mnt/swapfile
          dir=/mnt; [ -d "$dir" ] || dir=/var/tmp
          avail=$(df -BG --output=avail "$dir" | tail -1 | tr -dc '0-9')
          size=$(( avail > 26 ? 20 : avail - 6 ))
          [ "$size" -ge 8 ] || { echo "only ${avail}G free on $dir"; exit 1; }
          sudo fallocate -l "${size}G" "$dir/dgg-swapfile"
          sudo chmod 600 "$dir/dgg-swapfile"
          sudo mkswap "$dir/dgg-swapfile"
          sudo swapon "$dir/dgg-swapfile"
          sudo sysctl vm.swappiness=100
          free -h; swapon --show
      - name: Take the swap away
        if: matrix.swap == 'no'
        run: |
          sudo swapoff -a || true
          free -h; swapon --show || true
      - name: Install binary dependencies
        run: sudo apt-get update && sudo apt-get install -y xorg-dev mesa-utils xvfb libgl1 freeglut3-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Install documentation dependencies
        run: |
          xvfb-run -s '-screen 0 1024x768x24' julia --project=docs -e '
            using Pkg
            Pkg.instantiate(; workspace = true)'
      - name: Start the memory sampler
        run: |
          cat > /tmp/sample.sh <<'SH'
          while true; do
            awk '/^MemTotal:/{mt=$2} /^MemAvailable:/{ma=$2} /^SwapTotal:/{st=$2} /^SwapFree:/{sf=$2}
                 END {printf "%.2f\n", (mt-ma+st-sf)/1048576}' /proc/meminfo >> /tmp/mem.log
            sleep 2
          done
          SH
          chmod +x /tmp/sample.sh
          nohup /tmp/sample.sh >/dev/null 2>&1 &
          echo started
      - name: Run the hydrology pipeline
        run: |
          xvfb-run -s '-screen 0 1024x768x24' julia --project=docs \
            lib/DiscreteGlobalGridVisualizations/bench/hydrology_level.jl ${{ matrix.level }} ${{ matrix.draw }}
      - name: High-water mark
        if: always()
        run: |
          echo "peak (memory + swap) in use during the job:"
          sort -g /tmp/mem.log | tail -1
          free -h
          swapon --show || true

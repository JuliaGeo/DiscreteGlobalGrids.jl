name: TagBot
on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      lookback:
        default: "3"
permissions:
  actions: read
  checks: read
  contents: write
  deployments: read
  issues: read
  discussions: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read
jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    # One job per package in this monorepo, so each registered package gets tagged
    # (subpackages as `<Name>-v<version>`) and one failure does not block the rest.
    strategy:
      fail-fast: false
      matrix:
        subdir:
          - ""
          - lib/DiscreteGlobalGridsConformanceTesting
          - lib/DiscreteGlobalGridsVisualization
          - lib/GlobalRegridding
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ssh: ${{ secrets.DOCUMENTER_KEY }}
          subdir: ${{ matrix.subdir }}

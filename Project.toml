name = "DiscreteGlobalGrids"
uuid = "443be784-8f3c-41ab-9ff0-108bddc7e690"
version = "0.1.0"
authors = ["Anshul Singhvi <anshulsinghvi@gmail.com>", "Fabian Gans <fabian.gans@bgc-jena.mpi.de>", "Maarten Pronk <git@evetion.nl>", "Alexander Kmoch <alexander.kmoch@ut.ee>", "and contributors"]

[workspace]
projects = ["test", "docs", "lib/DiscreteGlobalGridsConformanceTesting", "lib/GlobalRegridding", "lib/DiscreteGlobalGridVisualizations", "lib/DiscreteGlobalGridVisualizations/test"]

[deps]
ConservativeRegridding = "8e50ac2c-eb48-49bc-a402-07c87b949343"
DE9IM = "5483dedb-0874-478e-8d7a-8c665bf87f01"
DimensionalData = "0703355e-b756-11e9-17c0-8b28908087d0"
Extents = "411431e0-e8b7-467b-b5e0-f676ba4f2910"
GeoInterface = "cf35fbd7-0cd7-5166-be24-54bfbe79505f"
GeometryOps = "3251bfac-6a57-4b6d-aa61-ac1fef2975ab"
GeometryOpsCore = "05efe853-fabf-41c8-927e-7063c8b9f013"
GlobalRegridding = "76847d5f-3a3e-4aa5-90cc-2a3a47dd1c11"
H3_jll = "60c8821e-da38-5dbd-93c7-983f1e6d69be"
Healpix = "9f4e344d-96bc-545a-84a3-ae6b9e1b672b"
SmallCollections = "2b935e18-93d6-40ac-ae34-fe54c09f00e1"

[weakdeps]
Makie = "ee78f7c6-11fb-53f2-987a-cfe4a2b5a57a"
Zarr = "0a941bbe-ad1d-11e8-39d9-ab76183a1d99"

[extensions]
MakieExt = ["Makie"]
DiscreteGlobalGridsZarrExt = ["Zarr"]

[sources]
ConservativeRegridding = {rev = "claude/budget-frontier", url = "https://github.com/JuliaGeo/ConservativeRegridding.jl"}
GeometryOps = {rev = "as/intersection_area", url = "https://github.com/JuliaGeo/GeometryOps.jl.git"}
GeometryOpsCore = {rev = "main", subdir = "GeometryOpsCore", url = "https://github.com/JuliaGeo/GeometryOps.jl.git"}
# Not a workspace member: it resolves its own Manifest, so
# `julia --project=lib/GlobalRegridding` stays self-contained.
GlobalRegridding = {path = "lib/GlobalRegridding"}

[compat]
DE9IM = "0.1"
GeometryOpsCore = "0.1.11"
SmallCollections = "0.6.3"
Zarr = "0.10"
julia = "1.11"

# The ray-tracing environment.
#
# `docs/` proper is the Documenter build and stays on the released Makie stack;
# path tracing needs Makie's `sd/lava` branch and the Vulkan packages under it,
# which is a different resolution of the same graph.
#
# This is deliberately NOT a workspace member. A workspace shares one manifest
# across every member, so putting this in it resolved the whole repo — `docs`
# included — against branch Makie, and the released GLMakie and WGLMakie that
# the documentation builds with do not work against it: they call
# `add_computation!(graph, scene, Val(:...))` where the branch takes
# `Symbol...`, so `using GLMakie` fails to precompile. One shared manifest
# cannot hold both stacks, and the docs build is not worth moving onto an
# unreleased branch to gain one. So this project resolves its own.
#
# The cost of standing alone is that every non-registry package anywhere in the
# graph has to be named below, not just the direct dependencies: Julia honours
# `[sources]` from the top-level project only, so the ones `DiscreteGlobalGrids`
# and `GlobalRegridding` declare for themselves are not consulted from here.
# That is why `GlobalRegridding` appears as a dep at all — nothing in this
# environment calls it; it is here so that the source naming it is legal.
#
# `Pkg.add` rewrites this file and drops every comment in it. Recover the prose
# from git rather than retyping it if that happens again.
#
#     julia -t auto --project=docs/raytracing examples/river_flythrough/river_flythrough_raytraced.jl
#
# The `[sources]` below are RayDemo's: the ray-tracing stack is a set of
# branches that only resolve together, so they are pinned as a set rather than
# one at a time.
#
# Three of them are this example's rather than RayDemo's, and are unmerged
# fixes it needs. Repoint each at whatever carries the fix once it lands:
#
#   Makie   as/raymakie-material-and-ffmpeg      off `sd/lava`
#           `extract_material` dropped the colour of a material that reaches a
#           plot as a recipe-forwarded graph edge rather than an input, so the
#           terrain — `dggsurface!` is such a recipe — rendered flat grey
#           instead of by its colormap. The branch also sends
#           `record_longrunning` to `get_ffmpeg_path()`: it still named
#           `FFMPEG_jll`, which has been a weak dependency since Makie v0.25 and
#           so is unbound in `Makie`, and every `--video` run died there having
#           already rendered and written every frame.
#
#   Hikari  as/hw-aux-normals-rebased            off `sd/compile-optimizations`
#           Three commits. The denoiser gets real normals and unmirrored aux
#           buffers. The N-instance `push!` gets an `sbt_offset`, without which
#           instanced geometry reads another material type's array — wrong
#           materials, and a device loss once the read runs off the end of it.
#           And `sample_batch` merges several samples into one wavefront pass,
#           which pays below about a megapixel and costs VRAM above it.
#
#   Lava    as/refit-preserve-custom-index-rebased  off `sd/compiler-optimizations`
#           A TLAS refit restamped every instance's `custom_index` from the
#           batch's, which is 0, and that index is how a shader finds the
#           instance's material — so a video's materials went wrong from the
#           first refit on.
#
# `Makie`, `ComputePipeline` and `RayMakie` all come from that one Makie rev:
# the branch forks off `sd/lava` and touches `Makie/` and `RayMakie/`, so naming
# it three times names one tree three times.

